spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/filestorage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-change-it-before-any-real-deployment-1234}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Binary file storage location (local disk)
storage.location=${STORAGE_LOCATION:./uploads}

# CORS / frontend
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Seeded on first boot if the username doesn't exist yet (see AdminSeeder)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
admin.email=${ADMIN_EMAIL:admin@filestorage.local}

# ---------------------------------------------------------------------------
# AI: models (Ollama), vector store (pgvector), MCP server
# ---------------------------------------------------------------------------
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=${AI_CHAT_MODEL:llama3.2:3b}
# The Ollama client is built from Boot's RestClient.Builder, so these apply to model calls.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s
# Fail fast to a 503 instead of retrying a slow model for minutes
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.mcp.server.name=securedocs-ai
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Search and read the authenticated user's own documents. Always cite fileName and page.

# Application AI settings (see AiProperties)
ai.default-top-k=5
ai.max-top-k=10
ai.similarity-threshold=0.5
ai.max-question-length=1000
