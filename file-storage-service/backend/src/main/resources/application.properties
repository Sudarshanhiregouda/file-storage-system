spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/filestorage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8080}
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-change-it-before-any-real-deployment-1234}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Binary file storage location (local disk)
storage.location=${STORAGE_LOCATION:./uploads}

# CORS / frontend
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Seeded on first boot if the username doesn't exist yet (see AdminSeeder)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
admin.email=${ADMIN_EMAIL:admin@filestorage.local}
