# Optional profile: activate with --spring.profiles.active=oauth2 (or SPRING_PROFILES_ACTIVE=oauth2)
# once you have real Google OAuth2 credentials. Without this profile active, the app
# runs with JWT username/password auth only and skips OAuth2 login entirely.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
