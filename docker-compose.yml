services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: securedocs-postgres
    environment:
      POSTGRES_DB: filestorage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password   # local development default, matches application.properties
    ports:
      # Set POSTGRES_PORT=5433 (and DB_URL to match) if a local Postgres already uses 5432
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filestorage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
